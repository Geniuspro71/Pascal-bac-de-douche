<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Piatto doccia inox 240 × 80 cm</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#11181d;color:#f3f6f7;font:15px system-ui,-apple-system,sans-serif}#view{position:absolute;inset:0;touch-action:none}canvas{display:block;width:100%;height:100%;touch-action:none}.panel{position:absolute;top:12px;left:12px;padding:12px 14px;max-width:calc(100% - 24px);border:1px solid #ffffff25;border-radius:12px;background:#11191fdf;backdrop-filter:blur(12px);pointer-events:none}h1{font-size:16px;margin:0 0 5px;font-weight:650}.sub{font-size:12px;color:#c2cdd2;line-height:1.5}.actions{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:7px;max-width:calc(100% - 16px)}button{border:1px solid #ffffff45;border-radius:10px;background:#253640;color:#f5f8fa;padding:11px 12px;font-size:13px;white-space:nowrap}button:active{background:#405a67}#hint{position:absolute;bottom:67px;left:50%;transform:translateX(-50%);font-size:12px;color:#d0d9dd;background:#11191fdf;padding:7px 11px;border-radius:8px;white-space:nowrap;pointer-events:none}#error{display:none;position:absolute;left:12px;right:12px;top:100px;padding:12px;background:#452d25;color:#fff;border-radius:10px;font-size:13px}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<div id="view"></div>
<div class="panel"><h1>Piatto doccia in acciaio inox</h1><div class="sub">240 × 80 cm · ribasso centrale 5 cm · scarico Ø 10 cm<br>Modello 3D interattivo · inox spazzolato</div></div>
<div id="hint">Trascina per ruotare · pizzica per ingrandire</div>
<div class="actions"><button id="reset">Vista iniziale</button><button id="dims">Quote: ON</button><button id="top">Vista dall’alto</button></div>
<div id="error"></div>
<script type="module">
const host=document.getElementById('view'),err=document.getElementById('error');
try{
 const THREE=await import('three');
 const {OrbitControls}=await import('three/addons/controls/OrbitControls.js');
 const scene=new THREE.Scene();scene.background=new THREE.Color(0x20272b);
 const camera=new THREE.PerspectiveCamera(36,1,.01,100);camera.up.set(0,0,1);
 const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false,powerPreference:'high-performance'});
 renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.2;renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;host.appendChild(renderer.domElement);
 const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.dampingFactor=.075;controls.minDistance=1.5;controls.maxDistance=8;controls.target.set(0,0,0);
 // Procedural studio environment: broad softboxes create readable reflections on metal.
 const envCanvas=document.createElement('canvas');envCanvas.width=1024;envCanvas.height=512;const ec=envCanvas.getContext('2d');
 const eg=ec.createLinearGradient(0,0,0,512);eg.addColorStop(0,'#202a31');eg.addColorStop(.38,'#9aa6ac');eg.addColorStop(.55,'#343e44');eg.addColorStop(1,'#151c21');ec.fillStyle=eg;ec.fillRect(0,0,1024,512);
 [[70,0,115,512,'#e6edf0'],[230,0,290,512,'#39464e'],[390,0,475,512,'#f3f5f4'],[590,0,660,512,'#5c6970'],[760,0,865,512,'#e5e9e9'],[945,0,1000,512,'#4d5a61']].forEach(([x,y,w,h,c])=>{const g=ec.createLinearGradient(x,0,x+w,0);g.addColorStop(0,'#11191f');g.addColorStop(.35,c);g.addColorStop(.7,c);g.addColorStop(1,'#182127');ec.fillStyle=g;ec.fillRect(x,y,w,h)});
 const envTex=new THREE.CanvasTexture(envCanvas);envTex.mapping=THREE.EquirectangularReflectionMapping;envTex.colorSpace=THREE.SRGBColorSpace;
 // Convert the studio panorama to a filtered environment map for stable metal reflections.
 const pmrem=new THREE.PMREMGenerator(renderer);pmrem.compileEquirectangularShader();const envRT=pmrem.fromEquirectangular(envTex);scene.environment=envRT.texture;envTex.dispose();pmrem.dispose();
 // Bathroom floor and tiled wall for context.
 const floorMat=new THREE.MeshStandardMaterial({color:0x777b7b,roughness:.82,metalness:.03});
 const floor=new THREE.Mesh(new THREE.PlaneGeometry(6,5),floorMat);floor.position.set(0,0,-.125);floor.receiveShadow=true;scene.add(floor);
 const grout=new THREE.LineBasicMaterial({color:0x4d5558,transparent:true,opacity:.65});
 for(let x=-3;x<=3.01;x+=.4){const l=new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(x,-2.5,-.122),new THREE.Vector3(x,2.5,-.122)]),grout);scene.add(l)}
 for(let y=-2.5;y<=2.51;y+=.4){const l=new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(-3,y,-.122),new THREE.Vector3(3,y,-.122)]),grout);scene.add(l)}
 const wallMat=new THREE.MeshStandardMaterial({color:0x777b7d,roughness:.9});
 const wall=new THREE.Mesh(new THREE.PlaneGeometry(6,3),wallMat);wall.rotation.x=Math.PI/2;wall.position.set(0,.78,1.35);wall.receiveShadow=true;scene.add(wall);
 for(let x=-3;x<=3.01;x+=.75){const l=new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(x,.775,-.12),new THREE.Vector3(x,.775,2.85)]),new THREE.LineBasicMaterial({color:0x4e565a,transparent:true,opacity:.45}));scene.add(l)}
 for(let z=.0;z<=2.851;z+=.5){const l=new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(-3,.775,z),new THREE.Vector3(3,.775,z)]),new THREE.LineBasicMaterial({color:0x4e565a,transparent:true,opacity:.45}));scene.add(l)}
 const hemi=new THREE.HemisphereLight(0xeaf4fa,0x41474a,.7);scene.add(hemi);
 const key=new THREE.DirectionalLight(0xfff5e8,2.1);key.position.set(-2.5,-2,4);key.castShadow=true;key.shadow.mapSize.set(1536,1536);key.shadow.camera.left=-2;key.shadow.camera.right=2;key.shadow.camera.top=2;key.shadow.camera.bottom=-2;key.shadow.bias=-.00015;scene.add(key);
 const fill=new THREE.DirectionalLight(0xc7e2f5,1.1);fill.position.set(2,1.5,2.8);scene.add(fill);
 const rim=new THREE.DirectionalLight(0xffffff,1.35);rim.position.set(0,3,2.2);scene.add(rim);
 const L=2.4,W=.8,D=.05,corners=[[-L/2,-W/2,0],[L/2,-W/2,0],[L/2,W/2,0],[-L/2,W/2,0]],center=[0,0,-D];
 const product=new THREE.Group();scene.add(product);
 // Fine directional brushing texture on the steel.
 const texCanvas=document.createElement('canvas');texCanvas.width=1024;texCanvas.height=512;const tc=texCanvas.getContext('2d');tc.fillStyle='rgb(132,132,132)';tc.fillRect(0,0,1024,512);
 // Very fine, predominantly linear abrasion, typical of brushed stainless steel.
 for(let i=0;i<18000;i++){const y=Math.random()*512,x=Math.random()*1024,v=105+Math.floor(Math.random()*65);tc.fillStyle='rgb('+v+','+v+','+v+')';tc.fillRect(x,y,8+Math.random()*100,.25+Math.random()*.45)}
 const brush=new THREE.CanvasTexture(texCanvas);brush.wrapS=brush.wrapT=THREE.RepeatWrapping;brush.repeat.set(2,1);brush.colorSpace=THREE.NoColorSpace;brush.anisotropy=renderer.capabilities.getMaxAnisotropy();
 const steel=new THREE.MeshPhysicalMaterial({color:0x9ca8ae,metalness:1,roughness:.29,roughnessMap:brush,envMapIntensity:2.35,clearcoat:.18,clearcoatRoughness:.28,side:THREE.DoubleSide});
 for(let i=0;i<4;i++){const a=corners[i],b=corners[(i+1)%4],g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute([...a,...b,...center],3));g.computeVertexNormals();const face=new THREE.Mesh(g,steel);face.castShadow=true;face.receiveShadow=true;product.add(face)}
 const edgeMat=new THREE.MeshStandardMaterial({color:0xe0e6e8,metalness:.95,roughness:.2,envMapIntensity:1.4});
 for(let i=0;i<4;i++){const curve=new THREE.LineCurve3(new THREE.Vector3(...corners[i]),new THREE.Vector3(...corners[(i+1)%4]));const edge=new THREE.Mesh(new THREE.TubeGeometry(curve,1,.006,6,false),edgeMat);product.add(edge)}
 // Drain recess and brushed circular collar.
 const drain=new THREE.Mesh(new THREE.CircleGeometry(.05,64),new THREE.MeshStandardMaterial({color:0x141b1f,metalness:.65,roughness:.34,side:THREE.DoubleSide}));drain.position.set(0,0,-D+.002);product.add(drain);
 const collar=new THREE.Mesh(new THREE.RingGeometry(.052,.064,64),new THREE.MeshPhysicalMaterial({color:0x89969c,metalness:.98,roughness:.18,envMapIntensity:1.8,side:THREE.DoubleSide}));collar.position.set(0,0,-D+.004);product.add(collar);
 // Thin dark underside gives the sheet a visible finished edge.
 const sideMat=new THREE.MeshStandardMaterial({color:0x59656b,metalness:.85,roughness:.29,side:THREE.DoubleSide});
 for(let i=0;i<4;i++){const a=corners[i],b=corners[(i+1)%4],a2=[a[0],a[1],-.018],b2=[b[0],b[1],-.018],g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute([...a,...b,...b2,...a,...b2,...a2],3));g.computeVertexNormals();product.add(new THREE.Mesh(g,sideMat))}
 const dims=new THREE.Group();scene.add(dims);const lineMat=new THREE.LineBasicMaterial({color:0xf2f5f6});
 function seg(a,b){dims.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(...a),new THREE.Vector3(...b)]),lineMat))}
 function tag(str,pos){const c=document.createElement('canvas');c.width=256;c.height=64;const x=c.getContext('2d');x.font='bold 30px system-ui';x.textAlign='center';x.fillStyle='#f7fafb';x.shadowColor='#11191f';x.shadowBlur=5;x.fillText(str,128,43);const t=new THREE.CanvasTexture(c);const s=new THREE.Sprite(new THREE.SpriteMaterial({map:t,transparent:true,depthTest:false}));s.position.set(...pos);s.scale.set(.48,.12,1);dims.add(s)}
 seg([-1.2,-.55,.018],[1.2,-.55,.018]);tag('240 cm',[0,-.65,.035]);seg([1.32,-.4,.018],[1.32,.4,.018]);tag('80 cm',[1.42,0,.03]);seg([0,0,-.05],[.16,0,-.05]);tag('−5 cm',[.25,.02,-.05]);tag('Scarico Ø 10 cm',[0,.14,-.04]);
 const gridToggle=()=>{dims.visible=!dims.visible;document.getElementById('dims').textContent='Quote: '+(dims.visible?'ON':'OFF')};document.getElementById('dims').onclick=gridToggle;
 function initial(){camera.position.set(2.9,-2.9,2.45);controls.target.set(0,0,-.015);controls.update()}initial();
 document.getElementById('reset').onclick=initial;document.getElementById('top').onclick=()=>{camera.position.set(0,-.01,4.4);controls.target.set(0,0,-.02);controls.update()};
 function resize(){const w=host.clientWidth,h=host.clientHeight;if(!w||!h)return;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}window.addEventListener('resize',resize);resize();
 renderer.setAnimationLoop(()=>{controls.update();renderer.render(scene,camera)});
}catch(e){console.error(e);err.style.display='block';err.textContent='Avvio 3D non riuscito: '+(e&&e.message?e.message:'browser non compatibile')+'. Prova ad aprire il link direttamente in Safari.'}
</script>
</body></html>
