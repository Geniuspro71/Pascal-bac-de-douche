<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Piatto doccia inox 240 × 80 cm</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101820;color:#edf3f6;font:15px system-ui,-apple-system,sans-serif}#view{position:absolute;inset:0;touch-action:none}canvas{display:block;width:100%;height:100%;touch-action:none}.panel{position:absolute;top:14px;left:14px;max-width:calc(100% - 28px);padding:13px 15px;border:1px solid #ffffff24;border-radius:12px;background:#13212bd9;backdrop-filter:blur(10px);pointer-events:none}h1{font-size:16px;margin:0 0 5px;font-weight:650}.sub{font-size:12px;color:#b8c7cf;line-height:1.5}.actions{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);display:flex;gap:8px;max-width:calc(100% - 16px)}button{border:1px solid #ffffff35;border-radius:10px;background:#203541;color:#f5f8fa;padding:11px 12px;font-size:13px;white-space:nowrap}button:active{background:#365365}#hint{position:absolute;bottom:72px;left:50%;transform:translateX(-50%);font-size:12px;color:#b8c7cf;background:#13212bd9;padding:7px 11px;border-radius:8px;white-space:nowrap;pointer-events:none}
</style>
</head>
<body>
<div id="view"><canvas id="model"></canvas></div>
<div class="panel"><h1>Piatto doccia in acciaio inox</h1><div class="sub">240 × 80 cm · ribasso centrale 5 cm · scarico Ø 10 cm<br>Modello concettuale interattivo</div></div>
<div id="hint">Trascina per ruotare · pizzica per ingrandire</div>
<div class="actions"><button id="reset">Vista iniziale</button><button id="dims">Quote: ON</button><button id="top">Vista dall’alto</button></div>
<script>
(function(){
'use strict';
const canvas=document.getElementById('model'),ctx=canvas.getContext('2d');
const L=2.4,W=.8,DROP=.05;
let yaw=-.72,elev=.58,zoom=1,showDims=true,drag=null,pinch=null,raf=0;
const corners=[[-L/2,-W/2,0],[L/2,-W/2,0],[L/2,W/2,0],[-L/2,W/2,0]],center=[0,0,-DROP];
function resize(){const r=canvas.getBoundingClientRect(),dpr=Math.min(window.devicePixelRatio||1,2);canvas.width=Math.max(1,Math.round(r.width*dpr));canvas.height=Math.max(1,Math.round(r.height*dpr));ctx.setTransform(dpr,0,0,dpr,0,0);draw()}
function project(p,w,h){
 const cy=Math.cos(yaw),sy=Math.sin(yaw),ce=Math.cos(elev),se=Math.sin(elev);
 const xr=p[0]*cy-p[1]*sy,dep=p[0]*sy+p[1]*cy;
 const depth=4.4-dep*ce-p[2]*se;
 const focal=Math.min(w,h)*1.02*zoom;
 return {x:w*.5+xr*focal/depth,y:h*.51-(p[2]*ce-dep*se)*focal/depth,depth};
}
function poly(points,fill,stroke){ctx.beginPath();points.forEach((p,i)=>{const q=project(p,canvas.clientWidth,canvas.clientHeight);if(i===0)ctx.moveTo(q.x,q.y);else ctx.lineTo(q.x,q.y)});ctx.closePath();ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1.3;ctx.stroke()}}
function line(a,b,color,width=1,dash=[]){const w=canvas.clientWidth,h=canvas.clientHeight,p=project(a,w,h),q=project(b,w,h);ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(q.x,q.y);ctx.strokeStyle=color;ctx.lineWidth=width;ctx.setLineDash(dash);ctx.stroke();ctx.setLineDash([])}
function text(str,p,dx,dy){const q=project(p,canvas.clientWidth,canvas.clientHeight);ctx.font='600 13px system-ui,-apple-system,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineWidth=3.5;ctx.strokeStyle='#101820';ctx.strokeText(str,q.x+dx,q.y+dy);ctx.fillStyle='#edf5f8';ctx.fillText(str,q.x+dx,q.y+dy)}
function draw(){
 const w=canvas.clientWidth,h=canvas.clientHeight;if(!w||!h)return;
 ctx.clearRect(0,0,w,h);
 // subtle background glow
 const g=ctx.createRadialGradient(w*.5,h*.5,10,w*.5,h*.5,Math.max(w,h)*.65);g.addColorStop(0,'#182833');g.addColorStop(1,'#101820');ctx.fillStyle=g;ctx.fillRect(0,0,w,h);
 // Floor reference grid
 for(let x=-2;x<=2.001;x+=.2)line([x,-1.15,-.13],[x,1.15,-.13],'rgba(150,180,195,.08)',.7);
 for(let y=-1;y<=1.001;y+=.2)line([-2,y,-.13],[2,y,-.13],'rgba(150,180,195,.08)',.7);
 // Four continuous sloping triangular planes, perimeter at zero and center -5 cm
 const shades=['#c7d1d6','#9eabb2','#d5dde0','#aebbc1'];
 for(let i=0;i<4;i++){const a=corners[i],b=corners[(i+1)%4];poly([a,b,center],shades[i],'#e1e9ec')}
 // perimeter and central drain
 for(let i=0;i<4;i++)line(corners[i],corners[(i+1)%4],'#f0f5f7',2);
 const c=project(center,w,h),rad=Math.max(5,Math.min(w,h)*.05*zoom*1.02/(4.4+.05*Math.sin(elev)));
 ctx.save();ctx.translate(c.x,c.y);ctx.scale(1,.55+Math.abs(Math.sin(elev))*.25);
 const rg=ctx.createRadialGradient(-rad*.25,-rad*.3,1,0,0,rad*1.4);rg.addColorStop(0,'#35434b');rg.addColorStop(.55,'#17232a');rg.addColorStop(1,'#66747b');ctx.beginPath();ctx.arc(0,0,rad,0,Math.PI*2);ctx.fillStyle=rg;ctx.fill();ctx.strokeStyle='#e5edf0';ctx.lineWidth=2;ctx.stroke();ctx.beginPath();ctx.arc(0,0,rad*.66,0,Math.PI*2);ctx.strokeStyle='#0b1217';ctx.lineWidth=1.5;ctx.stroke();ctx.restore();
 if(showDims){
  line([-L/2,-W/2-.12,.012],[L/2,-W/2-.12,.012],'#d9e5ea',1.2);line([-L/2,-W/2-.16,.012],[-L/2,-W/2-.08,.012],'#d9e5ea');line([L/2,-W/2-.16,.012],[L/2,-W/2-.08,.012],'#d9e5ea');text('240 cm',[0,-W/2-.16,.02],0,-10);
  line([L/2+.12,-W/2,.012],[L/2+.12,W/2,.012],'#d9e5ea',1.2);line([L/2+.08,-W/2,.012],[L/2+.16,-W/2,.012],'#d9e5ea');line([L/2+.08,W/2,.012],[L/2+.16,W/2,.012],'#d9e5ea');text('80 cm',[L/2+.14,0,.02],15,0);
  line([0,0,-DROP],[.18,0,-DROP],'#f2f7f9',1.2);text('−5 cm',[.18,0,-DROP],18,0);text('Scarico Ø 10 cm',[0,.13,-DROP],0,15);
 }
}
function reset(){yaw=-.72;elev=.58;zoom=1;draw()}
document.getElementById('reset').addEventListener('click',reset);
document.getElementById('dims').addEventListener('click',()=>{showDims=!showDims;document.getElementById('dims').textContent='Quote: '+(showDims?'ON':'OFF');draw()});
document.getElementById('top').addEventListener('click',()=>{elev=1.48;yaw=-.72;draw()});
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);drag={x:e.clientX,y:e.clientY,id:e.pointerId}});
canvas.addEventListener('pointermove',e=>{if(!drag||drag.id!==e.pointerId)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;drag.x=e.clientX;drag.y=e.clientY;yaw+=dx*.009;elev=Math.max(.08,Math.min(1.5,elev+dy*.007));draw()});
canvas.addEventListener('pointerup',e=>{if(drag&&drag.id===e.pointerId)drag=null});
canvas.addEventListener('pointercancel',()=>{drag=null});
canvas.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(.65,Math.min(2.2,zoom*(e.deltaY<0?1.08:.92)));draw()},{passive:false});
let touchDistance=0;
canvas.addEventListener('touchstart',e=>{if(e.touches.length===2){touchDistance=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);drag=null}},{passive:true});
canvas.addEventListener('touchmove',e=>{if(e.touches.length===2){const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);if(touchDistance)zoom=Math.max(.65,Math.min(2.2,zoom*d/touchDistance));touchDistance=d;draw()}},{passive:true});
canvas.addEventListener('touchend',()=>{touchDistance=0},{passive:true});
window.addEventListener('resize',resize);resize();reset();
})();
</script>
</body></html>
