name: Verify Pascal shared geometry

on:
  push:
    branches: [main, 'repair/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pascal-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install pinned dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Syntax and geometry regression tests
        run: npm run check:syntax && npm run test:unit

      - name: Interactive browser regression tests
        run: npm run test:browser

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pascal-browser-evidence-${{ github.sha }}
          path: |
            test-results/**/*.png
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14
